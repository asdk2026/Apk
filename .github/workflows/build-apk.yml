name: Build & Release Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "21"

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Node Dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make Gradle Executable
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Locate & Rename APK
        run: |
          mkdir -p release-output
          cp android/app/build/outputs/apk/debug/app-debug.apk release-output/BusinessMind-v1.0.3.apk
          ls -lh release-output/BusinessMind-v1.0.3.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BusinessMind-v1.0.3-APK
          path: release-output/BusinessMind-v1.0.3.apk

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: v1.0.3
          name: "Business Mind v1.0.3 (Android APK - Live Auto-Update)"
          body: |
            ## Business Mind - Official Android APK Release v1.0.3
            
            **Business Mind** Offline-First Retail Management System with Live Auto-Updates, Advanced POS, Multi-Variant Inventory, and Cloud Firestore Sync.
            
            ### Included in this build:
            - **Live Cloud Auto-Update**: Native WebView configured with live server URL so future app updates appear instantly on your phone without downloading new APKs!
            - **Fixed npm Dependency Resolution**: Resolved Vite and esbuild peer dependency conflict with `--legacy-peer-deps`.
            - **Editable Base Price**: Click to edit product Base Price directly in invoices with real-time recalculations.
            - **Package Qty Multiplier**: (+) and (−) stepper buttons for invoice line items.
            - **Firebase Cloud Database Sync**: Interactive switch toggle for Manual ↔ Automatic Firestore sync.
            
            ### Installation:
            Download and install `BusinessMind-v1.0.3.apk` on your Android device (Android 7.0+).
          files: release-output/BusinessMind-v1.0.3.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
