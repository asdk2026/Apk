name: Build & Release Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "21"

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Node Dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make Gradle Executable
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Locate & Rename APK
        run: |
          mkdir -p release-output
          cp android/app/build/outputs/apk/debug/app-debug.apk release-output/BusinessMind-v1.0.4.apk
          ls -lh release-output/BusinessMind-v1.0.4.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BusinessMind-v1.0.4-APK
          path: release-output/BusinessMind-v1.0.4.apk

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: v1.0.4
          name: "Business Mind v1.0.4 (Offline-First Android APK + Cloud Sync)"
          body: |
            ## Business Mind - Official Android APK Release v1.0.4
            
            **Business Mind** Retail Business Management System with Standalone Offline-First Architecture, Cloud Firestore Synchronization, and Advanced POS.
            
            ### Fixes & Enhancements in v1.0.4:
            - **Fixed "Webpage not available" / ERR_HTTP_RESPONSE_CODE_FAILURE**: Packaged standalone offline-first assets directly inside the APK for instant loading without external cloud-run authentication blocks.
            - **Firebase Cloud Database Sync**: Direct real-time bidirectional sync with Google Cloud Firestore (`business-mind-bc746`).
            - **Invoice Section**:
              - **Editable Base Price**: Click to edit Base Price directly in invoice line items with automatic recalculation.
              - **Package Qty Multiplier**: (+) and (−) stepper buttons for invoice line items.
            - **Settings**: Manual ↔ Automatic Cloud Database Sync toggle switch.
            
            ### Installation:
            Download and install `BusinessMind-v1.0.4.apk` on any Android device (Android 7.0+).
          files: release-output/BusinessMind-v1.0.4.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
