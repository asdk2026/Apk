name: Build & Release Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "21"

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Node Dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make Gradle Executable
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Locate & Rename APK
        run: |
          mkdir -p release-output
          cp android/app/build/outputs/apk/debug/app-debug.apk release-output/BusinessMind-v1.0.5.apk
          ls -lh release-output/BusinessMind-v1.0.5.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BusinessMind-v1.0.5-APK
          path: release-output/BusinessMind-v1.0.5.apk

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: v1.0.5
          name: "Business Mind v1.0.5 (Firebase Admin RBAC + Cloud Sync)"
          body: |
            ## Business Mind - Official Android APK Release v1.0.5
            
            **Business Mind** Retail Business Management System with Firebase Admin & Role-Based Access Control (RBAC), Standalone Offline-First Architecture, and Cloud Firestore Synchronization.
            
            ### Enhancements in v1.0.5:
            - **Firebase Admin & RBAC System**: Admin-only account creation (public sign-up disabled) with granular per-user & per-manager page/module and action permission controls synced in real time via Firestore.
            - **Clean UI**: Removed legacy local admin credentials, Danger Zone, and App install UI sections.
            - **Firebase Hosting & Rules Ready**: Added `firebase.json`, `.firebaserc`, and `firestore.rules` for project `business-mind-bc746`.
            
            ### Installation:
            Download and install `BusinessMind-v1.0.5.apk` on any Android device (Android 7.0+).
          files: release-output/BusinessMind-v1.0.5.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
