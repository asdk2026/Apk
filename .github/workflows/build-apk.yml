name: Build & Release Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "21"

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Node Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make Gradle Executable
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Locate & Rename APK
        run: |
          mkdir -p release-output
          cp android/app/build/outputs/apk/debug/app-debug.apk release-output/BusinessMind-v1.0.0.apk
          ls -lh release-output/BusinessMind-v1.0.0.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BusinessMind-v1.0.0-APK
          path: release-output/BusinessMind-v1.0.0.apk

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: v1.0.0
          name: "Business Mind v1.0.0 (Android APK)"
          body: |
            ## Business Mind - Official Android APK Release
            
            **Business Mind** is a complete Offline-First Retail Business Management System with Advanced POS, Multi-Variant Inventory, and Bilingual Support.
            
            ### Included Features:
            - **Offline-First & Cloud Sync**: Operates seamlessly with or without internet connection.
            - **Advanced POS**: Real-time bidirectional Price <-> Weight/Size formula calculation.
            - **Inventory Management**: Multi-variant tracking, low stock warnings, barcode scanning.
            - **Customer Due & Accounts**: Track credits, payments, and customer balance ledgers.
            - **Purchases & Supplier Restock**: Supplier procurement, expense logs, and profit/loss statements.
            - **Bilingual**: English & Bengali (বাংলা).
            
            ### Installation:
            Download and install `BusinessMind-v1.0.0.apk` directly on any Android device running Android 7.0 or higher.
          files: release-output/BusinessMind-v1.0.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
