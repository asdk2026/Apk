name: Build & Release Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android Project
        run: npx cap sync android

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Verify & Package APK
        run: |
          APK_PATH="android/app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$APK_PATH" ]; then
            echo "APK generated successfully at $APK_PATH"
            cp "$APK_PATH" BusinessMind-v1.0.0.apk
            ls -lh BusinessMind-v1.0.0.apk
          else
            echo "Error: APK not found!"
            find android/app/build/outputs -type f -name "*.apk"
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BusinessMind-Android-APK
          path: BusinessMind-v1.0.0.apk
          retention-days: 30

      - name: Publish to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v1.0.0"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, updating asset..."
            gh release upload "$TAG" BusinessMind-v1.0.0.apk --clobber
          else
            echo "Creating new release $TAG..."
            gh release create "$TAG" BusinessMind-v1.0.0.apk \
              --title "Business Mind v1.0.0 (Android APK)" \
              --notes "### Business Mind - Android APK Release
          
Official Android APK build for **Business Mind** — Complete Offline-First Retail Business Management System.

#### Key Highlights:
- **Offline-First Reliability**: Instant local SQLite & IndexedDB storage with automatic cloud synchronization.
- **Advanced POS & Bidirectional Calculation**: Real-time two-way Price $\leftrightarrow$ Size/Weight conversions.
- **Inventory & Multi-Variant Catalog**: Track products by unlimited qualities, sizes, weights, and minimum stock alerts.
- **Hardware Integration**: Built-in camera barcode and QR scanner.
- **Bilingual Interface**: Full English & Bengali (বাংলা) localized management.
- **Financial Intelligence**: Complete Sales, Purchases, Customer Due tracking, and Profit & Loss reports.

#### Installation Instructions:
1. Download **BusinessMind-v1.0.0.apk** below to your Android device.
2. Tap the downloaded file and select **Install** (allow installation from unknown sources if prompted).
3. Open **Business Mind** and enjoy a native mobile retail management experience!"
          fi
